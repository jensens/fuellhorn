name: Release

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qa:
    name: QA
    uses: ./.github/workflows/qa.yaml

  tests:
    name: Tests
    uses: ./.github/workflows/tests.yaml

  build:
    name: Build Package
    needs: [qa, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Wichtig für hatch-vcs

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build package
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to Test PyPI
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Re-Runs auf main scheitern sonst an bereits hochgeladenen Dateien (#377)
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event.action == 'published'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  docker-build:
    name: Build Docker (${{ matrix.platform }})
    needs: publish-pypi
    if: github.event.action == 'published'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Wait for PyPI availability
        run: |
          version="${{ steps.version.outputs.version }}"
          echo "Waiting for fuellhorn==$version on PyPI..."
          for i in {1..30}; do
            if curl -sf "https://pypi.org/pypi/fuellhorn/$version/json" > /dev/null; then
              echo "Package available on PyPI"
              exit 0
            fi
            echo "Attempt $i: Not yet available, waiting 10s..."
            sleep 10
          done
          echo "Timeout waiting for PyPI"
          exit 1

      - name: Set platform tag suffix
        id: platform
        run: |
          platform=${{ matrix.platform }}
          echo "suffix=${platform//\//-}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}-${{ steps.platform.outputs.suffix }}
          build-args: |
            FUELLHORN_VERSION=${{ steps.version.outputs.version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      # Schlägt der Smoke-Test fehl, bricht der Job ab und das Multi-Arch-Manifest
      # (Versions- und latest-Tag) wird nicht erzeugt (#414)
      - name: Smoke test image (lock, migrate, create-admin, health)
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}-${{ steps.platform.outputs.suffix }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"

          echo "::group::Installierte Versionen entsprechen uv.lock"
          uv export --frozen --no-dev --no-emit-project --no-hashes \
            | grep -E '^[A-Za-z0-9_.-]+==' | sed 's/ .*//' | tr 'A-Z_' 'a-z-' | sort > /tmp/expected.txt
          docker run --rm "$IMAGE" uv pip freeze --python /app/.venv/bin/python \
            | grep -E '^[A-Za-z0-9_.-]+==' | grep -vi '^fuellhorn==' | tr 'A-Z_' 'a-z-' | sort > /tmp/actual.txt
          if comm -23 /tmp/actual.txt /tmp/expected.txt | grep .; then
            echo "::error::Im Image installierte Versionen weichen von uv.lock ab (siehe oben)"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::migrate + create-admin (SQLite)"
          docker run --rm \
            -e FUELLHORN_SECRET=smoke-test-secret-0123456789abcdef \
            -e ADMIN_PASSWORD=smoke-test-password \
            "$IMAGE" sh -c "fuellhorn migrate && fuellhorn create-admin"
          echo "::endgroup::"

          echo "::group::Start + /api/health"
          cid=$(docker run -d -p 18080:8080 -e FUELLHORN_SECRET=smoke-test-secret-0123456789abcdef "$IMAGE")
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/api/health; then ok=1; break; fi
            sleep 2
          done
          docker logs "$cid" | tail -20
          docker rm -f "$cid" > /dev/null
          echo "::endgroup::"
          test "$ok" = 1

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.platform.outputs.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: Create Multi-Arch Manifest
    needs: docker-build
    if: github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # latest nur für stabile Releases, nie für Prereleases (#377)
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

  helm-publish:
    name: Publish Helm Chart
    # Chart erst veröffentlichen, wenn das zugehörige Image (Manifest) existiert (#377)
    needs: [qa, tests, docker-manifest]
    if: github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          # Get Python version from tag (e.g., v1.0.0a5 -> 1.0.0a5)
          pyversion="${GITHUB_REF_NAME#v}"
          echo "pyversion=$pyversion" >> $GITHUB_OUTPUT
          # Nur Tags, die sich eindeutig nach SemVer übersetzen lassen (#377):
          # X.Y.Z, X.Y.ZaN -> X.Y.Z-alpha.N, X.Y.ZbN -> -beta.N, X.Y.ZrcN -> -rc.N
          if [[ ! "$pyversion" =~ ^[0-9]+\.[0-9]+\.[0-9]+(a[0-9]+|b[0-9]+|rc[0-9]+)?$ ]]; then
            echo "::error::Tag v$pyversion ergibt keine gültige Chart-Version (erlaubt: X.Y.Z, X.Y.ZaN, X.Y.ZbN, X.Y.ZrcN; kein .devN/.postN)"
            exit 1
          fi
          semver=$(echo "$pyversion" | sed -E 's/([0-9]+\.[0-9]+\.[0-9]+)a([0-9]+)/\1-alpha.\2/; s/([0-9]+\.[0-9]+\.[0-9]+)b([0-9]+)/\1-beta.\2/; s/([0-9]+\.[0-9]+\.[0-9]+)rc([0-9]+)/\1-rc.\2/')
          echo "semver=$semver" >> $GITHUB_OUTPUT

      - name: Update Chart.yaml version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.semver }}/" charts/fuellhorn/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.version.outputs.pyversion }}\"/" charts/fuellhorn/Chart.yaml

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push Helm chart
        run: |
          helm package charts/fuellhorn
          helm push fuellhorn-${{ steps.version.outputs.semver }}.tgz oci://ghcr.io/${{ github.repository_owner }}
