name: Tests

on:
  workflow_call:

jobs:
  test-fast:
    name: Unit & Service Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit & service tests (parallel)
        run: uv run pytest tests/test_services tests/test_api tests/test_unit tests/test_auth tests/test_utils tests/test_migrations tests/test_cli.py tests/test_config.py tests/test_database_isolation.py -n auto --cov=app --cov-report=xml
        env:
          FUELLHORN_SECRET: test-fuellhorn-secret-for-ci-only

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-fast
          path: coverage.xml
          retention-days: 7

  test-ui:
    name: UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run UI tests
        run: uv run pytest tests/test_ui --cov=app --cov-report=xml --cov-report=term
        env:
          FUELLHORN_SECRET: test-fuellhorn-secret-for-ci-only

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ui
          path: coverage.xml
          retention-days: 7

  test-migrations-postgres:
    name: Migrations (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fuellhorn
          POSTGRES_PASSWORD: fuellhorn
          POSTGRES_DB: fuellhorn_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fuellhorn -d fuellhorn_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      # Dieselben Migrationstests wie im Fast-Job, aber gegen PostgreSQL: fängt dialektspezifisches
      # SQL (datetime('now'), Enum-Werte statt -Namen), das SQLite durchgehen lässt (Issue #390)
      - name: Run migration tests against PostgreSQL
        run: uv run pytest tests/test_migrations -p no:cacheprovider
        env:
          FUELLHORN_SECRET: test-fuellhorn-secret-for-ci-only
          MIGRATION_TEST_DATABASE_URL: postgresql://fuellhorn:fuellhorn@localhost:5432/fuellhorn_migrations
