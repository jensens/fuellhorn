# Dieselben Werkzeuge und Versionen wie die CI (aus uv.lock): lokale Hooks über `uv run` (#401).
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: pyupgrade
        name: pyupgrade --py314-plus
        entry: uv run pyupgrade --py314-plus
        language: system
        types: [python]
      - id: ty
        name: ty check app/
        entry: uv run ty check app/
        language: system
        pass_filenames: false
        files: ^app/.*\.py$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^charts/fuellhorn/templates/
      - id: check-added-large-files
