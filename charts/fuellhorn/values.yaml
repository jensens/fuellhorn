# Fuellhorn Helm Chart Values

replicaCount: 1

# Zeitzone des Containers (z.B. "Europe/Vienna"). Die App speichert naive lokale Zeitstempel;
# leer = UTC des Images (#401).
timezone: ""

image:
  repository: ghcr.io/jensens/fuellhorn
  # Leer = appVersion des Charts (immer die zum Chart passende, unveränderliche Version).
  # "latest" zeigt auf das zuletzt veröffentlichte stabile Release und ist für Produktion ungeeignet.
  tag: ""
  pullPolicy: IfNotPresent

# Sicherheitskontext für Pods (App, Init-Container, Migrations-Job)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Sicherheitskontext für Container
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  # NiceGUI schreibt Session-Storage nach /app/.nicegui, daher kein readOnlyRootFilesystem
  readOnlyRootFilesystem: false

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: fuellhorn.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Datenbank-Konfiguration
database:
  # "postgresql" oder "sqlite"
  type: postgresql

  # Externe PostgreSQL (wenn type: postgresql)
  external:
    host: ""
    port: 5432
    database: fuellhorn
    username: fuellhorn
    # existingSecret: Name eines bestehenden Secrets mit key "password"
    existingSecret: ""
    # Oder direkt (nicht empfohlen für Production)
    password: ""

# Secrets (MÜSSEN gesetzt werden!)
secrets:
  # Für Production: existingSecret mit dem Key "fuellhorn-secret" verwenden
  existingSecret: ""
  # Oder direkt setzen (nur für Testing). Signiert die Session-Cookies;
  # Rotation meldet alle Nutzer ab, Passwörter bleiben gültig.
  fuellhornSecret: ""

# Migrationen (Alembic)
migrations:
  # PostgreSQL: einmal pro Install/Upgrade als Helm-Hook-Job (pre-install, pre-upgrade)
  # statt in jedem Pod. Für SQLite (RWO-Volume) läuft stattdessen der Init-Container.
  job:
    enabled: true

# Init Containers
initContainers:
  # Database migrations (Alembic) als Init-Container; bei aktivem Migrations-Job
  # (PostgreSQL) automatisch übersprungen
  migrations:
    enabled: true

  # Create initial admin user
  adminUser:
    enabled: false  # Opt-in, disabled by default
    username: admin
    email: admin@fuellhorn.local
    # Pflicht, wenn enabled: bestehendes Secret mit Key "admin-password".
    # Klartext-Passwörter in Values werden nicht unterstützt (landen sonst in der Pod-Spec).
    existingSecret: ""

# SQLite Persistence (nur wenn database.type: sqlite)
persistence:
  enabled: true
  storageClass: ""
  size: 1Gi
  accessMode: ReadWriteOnce
  # PVC bei "helm uninstall" behalten (helm.sh/resource-policy: keep).
  # false: Helm löscht die PVC und damit die SQLite-Datenbank mit dem Release.
  keep: true

# Login-Sitzungen (NiceGUI-Storage). Im SQLite-Modus liegen sie auf dem Daten-PVC (/app/data/.nicegui).
# Im PostgreSQL-Modus wären sie ohne Volume flüchtig: jeder Pod-Neustart meldet alle Benutzer ab (#434).
sessions:
  # "pvc": kleines RWO-Volume nur für Sitzungen (PostgreSQL-Modus); erzwingt replicaCount=1 und Recreate.
  # "redis": NiceGUI-Storage in Redis (NICEGUI_REDIS_URL); Voraussetzung für replicaCount > 1.
  backend: pvc
  persistence:
    storageClass: ""
    size: 100Mi
    accessMode: ReadWriteOnce
    keep: true
  redis:
    # Verbindungs-URL, z.B. redis://redis.default.svc:6379/0 – oder existingSecret mit Key "redis-url"
    url: ""
    existingSecret: ""
    keyPrefix: "fuellhorn:"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Health Checks
livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
