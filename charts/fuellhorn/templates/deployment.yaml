{{- if and (eq .Values.database.type "sqlite") (gt (int .Values.replicaCount) 1) }}
{{- fail "database.type=sqlite erlaubt nur replicaCount=1 (eine SQLite-Datei auf einem RWO-Volume)" }}
{{- end }}
{{- if and (gt (int .Values.replicaCount) 1) (ne .Values.sessions.backend "redis") }}
{{- fail "replicaCount>1 braucht sessions.backend=redis (gemeinsamer Sitzungs-Speicher), sonst sind Benutzer je Pod abgemeldet (#434)" }}
{{- end }}
{{- if and (eq .Values.sessions.backend "redis") (not .Values.sessions.redis.url) (not .Values.sessions.redis.existingSecret) }}
{{- fail "sessions.backend=redis braucht sessions.redis.url oder sessions.redis.existingSecret (Key redis-url)" }}
{{- end }}
{{- if and .Values.initContainers.adminUser.enabled (not .Values.initContainers.adminUser.existingSecret) }}
{{- fail "initContainers.adminUser.existingSecret ist Pflicht (Secret mit Key admin-password); Klartext-Passwörter in Values werden nicht unterstützt" }}
{{- end }}
{{- $migrationJob := include "fuellhorn.migrationJobEnabled" . }}
{{- $migrateInit := and .Values.initContainers.migrations.enabled (not $migrationJob) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fuellhorn.fullname" . }}
  labels:
    {{- include "fuellhorn.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if eq (include "fuellhorn.usesDataVolume" .) "true" }}
  # RWO-Volume (SQLite-Daten oder Sitzungs-PVC): der alte Pod muss weg, bevor der neue startet (#377, #434)
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "fuellhorn.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fuellhorn.selectorLabels" . | nindent 8 }}
      annotations:
        # Geänderte Secret-Values (vom Chart verwaltete Secrets) starten die Pods neu (#377)
        checksum/secret: {{ printf "%s%s" (toYaml .Values.secrets) (toYaml .Values.database.external) | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or $migrateInit .Values.initContainers.adminUser.enabled }}
      initContainers:
        {{- if $migrateInit }}
        - name: migrate
          image: {{ include "fuellhorn.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["fuellhorn", "migrate"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- include "fuellhorn.databaseEnv" . | nindent 12 }}
            {{- include "fuellhorn.secretEnv" . | nindent 12 }}
          {{- include "fuellhorn.dataVolumeMount" . | nindent 10 }}
        {{- end }}
        {{- if .Values.initContainers.adminUser.enabled }}
        - name: create-admin
          image: {{ include "fuellhorn.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["fuellhorn", "create-admin"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- include "fuellhorn.databaseEnv" . | nindent 12 }}
            - name: ADMIN_USERNAME
              value: {{ .Values.initContainers.adminUser.username | quote }}
            - name: ADMIN_EMAIL
              value: {{ .Values.initContainers.adminUser.email | quote }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.initContainers.adminUser.existingSecret }}
                  key: admin-password
            {{- include "fuellhorn.secretEnv" . | nindent 12 }}
          {{- include "fuellhorn.dataVolumeMount" . | nindent 10 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "fuellhorn.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- include "fuellhorn.databaseEnv" . | nindent 12 }}
            {{- include "fuellhorn.secretEnv" . | nindent 12 }}
            {{- include "fuellhorn.sessionEnv" . | nindent 12 }}
            {{- with .Values.timezone }}
            # Naive lokale Zeitstempel (Sperrzeiten, Erfassungszeit) gelten in dieser Zone (#401)
            - name: TZ
              value: {{ . | quote }}
            {{- end }}
            {{- if or $migrateInit $migrationJob }}
            # Migrationen laufen im Init-Container bzw. Hook-Job, nicht in jedem Pod (#377)
            - name: FUELLHORN_SKIP_MIGRATIONS
              value: "true"
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- include "fuellhorn.dataVolumeMount" . | nindent 10 }}
      {{- if eq (include "fuellhorn.usesDataVolume" .) "true" }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "fuellhorn.dataClaimName" . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
