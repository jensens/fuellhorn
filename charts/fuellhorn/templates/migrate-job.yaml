{{- if include "fuellhorn.migrationJobEnabled" . }}
# Migrationen einmal pro Install/Upgrade statt in jedem Pod (#377).
# Nur PostgreSQL: SQLite liegt auf einem RWO-Volume und migriert im Init-Container.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fuellhorn.fullname" . }}-migrate
  labels:
    {{- include "fuellhorn.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        # Bewusst ohne app.kubernetes.io/name: der Service darf den Job-Pod nicht auswählen
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "fuellhorn.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["fuellhorn", "migrate"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: DB_TYPE
              value: {{ .Values.database.type | quote }}
            {{- if .Values.database.external.existingSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.external.existingSecret }}
                  key: url
            {{- else }}
            # Beim pre-install existiert das vom Chart verwaltete Secret noch nicht;
            # für Produktion database.external.existingSecret verwenden
            - name: DATABASE_URL
              value: {{ include "fuellhorn.databaseUrl" . | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
