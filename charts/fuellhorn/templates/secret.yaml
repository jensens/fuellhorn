{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fuellhorn.fullname" . }}-secrets
  labels:
    {{- include "fuellhorn.labels" . | nindent 4 }}
type: Opaque
data:
  fuellhorn-secret: {{ required "secrets.fuellhornSecret muss gesetzt sein (oder secrets.existingSecret mit Key fuellhorn-secret verwenden)" .Values.secrets.fuellhornSecret | b64enc | quote }}
{{- end }}
---
{{- if eq .Values.database.type "postgresql" }}
{{- if not .Values.database.external.existingSecret }}
{{- $url := include "fuellhorn.databaseUrl" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fuellhorn.fullname" . }}-db
  labels:
    {{- include "fuellhorn.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.database.external.password | b64enc | quote }}
  url: {{ $url | b64enc | quote }}
{{- end }}
{{- end }}
