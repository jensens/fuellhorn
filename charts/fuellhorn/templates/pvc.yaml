{{- if and (eq .Values.database.type "sqlite") .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "fuellhorn.fullname" . }}-data
  labels:
    {{- include "fuellhorn.labels" . | nindent 4 }}
  {{- if .Values.persistence.keep }}
  annotations:
    # Helm lässt die PVC (und damit die SQLite-Datenbank) bei helm uninstall stehen (#372)
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
{{- if eq (include "fuellhorn.sessionsOnPvc" .) "true" }}
---
# Kleines Volume nur für Login-Sitzungen im PostgreSQL-Modus (#434)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "fuellhorn.fullname" . }}-sessions
  labels:
    {{- include "fuellhorn.labels" . | nindent 4 }}
  {{- if .Values.sessions.persistence.keep }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    - {{ .Values.sessions.persistence.accessMode }}
  {{- if .Values.sessions.persistence.storageClass }}
  storageClassName: {{ .Values.sessions.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.sessions.persistence.size }}
{{- end }}
